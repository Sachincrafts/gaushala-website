<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
    <linearGradient id="bhagwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6d00"/>
      <stop offset="50%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#992b00"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="#fff7ed" stroke="url(#goldGrad)" stroke-width="4" filter="url(#softShadow)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#c43c00" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Sun Rays Behind -->
  <g opacity="0.35" stroke="#ff8f00" stroke-width="1.8">
    <line x1="100" y1="20" x2="100" y2="40"/>
    <line x1="100" y1="160" x2="100" y2="180"/>
    <line x1="20" y1="100" x2="40" y2="100"/>
    <line x1="160" y1="100" x2="180" y2="100"/>
    <line x1="43" y1="43" x2="57" y2="57"/>
    <line x1="143" y1="143" x2="157" y2="157"/>
    <line x1="157" y1="43" x2="143" y2="57"/>
    <line x1="43" y1="157" x2="57" y2="143"/>
  </g>

  <!-- Inner Badge Circle in Sacred Bhagwa -->
  <circle cx="100" cy="100" r="76" fill="url(#bhagwaGrad)"/>

  <!-- Decorative Lotus Base in Gold -->
  <path d="M70 145 C 85 130, 115 130, 130 145 C 115 152, 85 152, 70 145 Z" fill="#ffe082" opacity="0.95"/>
  <path d="M80 145 C 90 135, 110 135, 120 145 Z" fill="#fff" opacity="0.85"/>

  <!-- Cow & Calf Silhouette / Sacred Figure in Pure Cream -->
  <g fill="#fffaf0">
    <!-- Mother Cow Body -->
    <path d="M68 115 C 68 98, 80 92, 95 92 C 108 92, 120 96, 128 105 C 132 109, 135 116, 132 122 C 128 130, 118 133, 105 133 C 85 133, 68 128, 68 115 Z"/>
    <!-- Head & Horns -->
    <ellipse cx="74" cy="92" rx="11" ry="14" transform="rotate(-15 74 92)"/>
    <path d="M68 83 C 64 72, 60 70, 58 68 C 65 72, 70 78, 71 83 Z"/>
    <path d="M76 81 C 77 70, 81 66, 84 64 C 82 71, 79 76, 77 81 Z"/>
    <!-- Ears -->
    <path d="M63 90 C 56 93, 53 96, 55 98 C 58 98, 63 95, 65 92 Z"/>
    <path d="M82 88 C 88 90, 93 93, 93 95 C 91 97, 85 94, 81 90 Z"/>
    <!-- Calf Silhouette -->
    <path d="M112 118 C 112 108, 120 104, 128 104 C 136 104, 142 109, 142 118 C 142 124, 134 128, 126 128 C 118 128, 112 124, 112 118 Z"/>
    <circle cx="138" cy="103" r="6"/>
    <path d="M140 98 C 143 94, 145 92, 146 91 C 144 95, 142 98, 141 99 Z"/>
  </g>

  <!-- Sacred Tilak Symbol Above in Saffron Gold -->
  <g fill="#ffe082">
    <ellipse cx="100" cy="54" rx="3.5" ry="8"/>
    <circle cx="100" cy="66" r="3" fill="#ffb300"/>
  </g>

  <!-- Bottom Banner in Sacred Kesariya & Gold -->
  <rect x="35" y="152" width="130" height="23" rx="11.5" fill="#fff7ed" stroke="#e65100" stroke-width="1.8" filter="url(#softShadow)"/>
  <text x="100" y="168" font-family="'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#7c2200" text-anchor="middle">
    गौसेवा परमो धर्मः
  </text>
</svg>
